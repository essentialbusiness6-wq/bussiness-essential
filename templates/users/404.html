<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Business Essentials Prime</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/media/app logo.png"/>
    <link rel="stylesheet" href="/static/css/404.css">
</head>
<body>
    <div class="particles" id="particles"></div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle Dark Mode">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <main class="error-container">
        <!-- Floating Illustration -->
        <div class="error-illustration">
            <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="80" stroke="url(#paint0_linear)" stroke-width="2" stroke-dasharray="8 8" class="orbit"/>
                <path d="M70 100L90 120L130 80" stroke="url(#paint1_linear)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="checkmark"/>
                <path d="M60 60L140 140M140 60L60 140" stroke="var(--danger)" stroke-width="6" stroke-linecap="round" class="cross"/>
                <defs>
                    <linearGradient id="paint0_linear" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#4361ee"/>
                        <stop offset="1" stop-color="#4895ef"/>
                    </linearGradient>
                    <linearGradient id="paint1_linear" x1="70" y1="80" x2="130" y2="120" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#4361ee"/>
                        <stop offset="1" stop-color="#4895ef"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="error-content">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Page Not Found</h2>
            <p class="error-message">
                Oops! The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>
            
            <div class="error-actions">
                <a href="/dashboard" class="btn primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Back to Dashboard
                </a>
                <a href="/support" class="btn secondary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    Contact Support
                </a>
            </div>
        </div>
    </main>

    <script src="/static/js/404.js"></script>
</body>
</html>
